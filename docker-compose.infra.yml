services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: backends-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backends_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    # Log every connect/disconnect with the client IP (%h) — view with `docker compose -f docker-compose.infra.yml logs postgres`
    command:
      - postgres
      # Tắt log kết nối thành công để không bị rác bởi healthcheck local
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      # Luôn log các lỗi (bao gồm login failed) và các cảnh báo
      - -c
      - log_min_messages=warning
      # Log chi tiết lỗi xác thực (rất hữu ích để bắt login failed)
      - -c
      - log_min_error_statement=error
      # Tắt phân giải tên miền ngược để log nhanh hơn
      - -c
      - log_hostname=off
      # Định dạng log có kèm IP (%h) và User (%u)
      - -c
      - log_line_prefix=%m [%p] ip=%h user=%u db=%d app=%a
    ports:
      - '127.0.0.1:5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-backends_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: backends-redis
    restart: unless-stopped

    ports:
      - '${REDIS_PORT:-6380}:6379'

  rabbitmq:
    image: docker.io/library/rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}

    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
