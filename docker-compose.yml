name: tutor

# Commit shown on each built image (docker inspect label org.opencontainers.image.revision / env GIT_COMMIT).
# Export the sibling repos' HEADs before building, or run:
#   eval "$(scripts/git-commits.sh)" && docker compose up -d --build
# Each <SERVICE>_GIT_COMMIT falls back to "unknown" when unset.

x-infra-env: &infra-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: '5432'
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  USER_QUEUE: user_queue
  TUTOR_QUEUE: tutor_queue
  THIRD_QUEUE: third_queue

x-db-env: &db-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-af56f868db2a46029d4d210a342ac046}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-8f78b51c031c426fa58b47f875fec202}

x-service-deps: &service-deps
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }
  rabbitmq: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-8f78b51c031c426fa58b47f875fec202}
      POSTGRES_USER: ${POSTGRES_USER:-af56f868db2a46029d4d210a342ac046}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # CẬP NHẬT COMMAND TẠI ĐÂY
    command:
      - postgres
      # Tắt log kết nối thành công để không bị rác bởi healthcheck local
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      # Luôn log các lỗi (bao gồm login failed) và các cảnh báo
      - -c
      - log_min_messages=warning
      # Log chi tiết lỗi xác thực (rất hữu ích để bắt login failed)
      - -c
      - log_min_error_statement=error
      # Tắt phân giải tên miền ngược để log nhanh hơn
      - -c
      - log_hostname=off
      # Định dạng log có kèm IP (%h) và User (%u)
      - -c
      - log_line_prefix=%m [%p] ip=%h user=%u db=%d app=%a
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-af56f868db2a46029d4d210a342ac046} -d ${POSTGRES_DB:-8f78b51c031c426fa58b47f875fec202}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================================================
  # Infrastructure: Cache
  # ============================================================================
  redis:
    networks: [app-network]
    image: redis:7-alpine
    restart: unless-stopped
    # Loopback only: other services reach redis over app-network; never publish it to the LAN.
    # requirepass: without it any container or host process on the network reads session/OTP keys.
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Infrastructure: Message Queue
  # ============================================================================
  rabbitmq:
    networks: [app-network]
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 90s

  rabbitmq-acl:
    image: node:22-alpine
    restart: 'no'
    depends_on:
      rabbitmq: { condition: service_healthy }
    environment:
      RABBITMQ_MGMT_URL: http://rabbitmq:15672
      RABBITMQ_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      RABBITMQ_GATEWAY_PASSWORD: ${RABBITMQ_GATEWAY_PASSWORD:?set RABBITMQ_GATEWAY_PASSWORD}
      RABBITMQ_USER_SERVICE_PASSWORD: ${RABBITMQ_USER_SERVICE_PASSWORD:?set RABBITMQ_USER_SERVICE_PASSWORD}
      RABBITMQ_TUTOR_PASSWORD: ${RABBITMQ_TUTOR_PASSWORD:?set RABBITMQ_TUTOR_PASSWORD}
      RABBITMQ_THIRD_PASSWORD: ${RABBITMQ_THIRD_PASSWORD:?set RABBITMQ_THIRD_PASSWORD}
    volumes:
      - ./docker/rabbitmq/init-acl.mjs:/init-acl.mjs:ro
    command: ['node', '/init-acl.mjs']
    networks: [app-network]

  gateway:
    networks: [app-network]
    build:
      context: .
      args:
        GIT_COMMIT: ${GATEWAY_GIT_COMMIT:-unknown}
    restart: unless-stopped
    env_file: ./docker.env
    environment:
      <<: *infra-env
      RABBITMQ_URL: amqp://gateway_svc:${RABBITMQ_GATEWAY_PASSWORD:?set RABBITMQ_GATEWAY_PASSWORD}@rabbitmq:5672
      PORT: '8888'
      NODE_ENV: production
      # Session check (JWT -> third redis): fail closed unless explicitly opened.
      SESSION_CHECK_FAIL_OPEN: ${SESSION_CHECK_FAIL_OPEN:-false}
      # Refresh cookie: secure is already on in production; set COOKIE_SECURE=true when behind TLS elsewhere.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Number of reverse-proxy hops in front of the gateway (rate limits key on the real client IP).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Comma-separated hosts allowed for https:// notification redirectUrl values.
      NOTIFICATION_REDIRECT_HOSTS: ${NOTIFICATION_REDIRECT_HOSTS:-}
    ports: ['8888:8888']
    depends_on: *service-deps

  user:
    networks: [app-network]
    build:
      context: ../user
      args:
        GIT_COMMIT: ${USER_GIT_COMMIT:-unknown}
    restart: unless-stopped
    env_file: ../user/docker.env
    environment:
      <<: [*infra-env, *db-env]
      RABBITMQ_URL: amqp://user_svc:${RABBITMQ_USER_SERVICE_PASSWORD:?set RABBITMQ_USER_SERVICE_PASSWORD}@rabbitmq:5672
      PORT: '4001'
      NODE_ENV: production
    depends_on: *service-deps

  tutor-service:
    networks: [app-network]
    build:
      context: ../tutor
      args:
        GIT_COMMIT: ${TUTOR_GIT_COMMIT:-unknown}
    restart: unless-stopped
    env_file: ../tutor/docker.env
    environment:
      <<: [*infra-env, *db-env]
      RABBITMQ_URL: amqp://tutor_svc:${RABBITMQ_TUTOR_PASSWORD:?set RABBITMQ_TUTOR_PASSWORD}@rabbitmq:5672
      PORT: '4002'
      NODE_ENV: production
    depends_on: *service-deps

  third:
    networks: [app-network]
    build:
      context: ../third
      args:
        GIT_COMMIT: ${THIRD_GIT_COMMIT:-unknown}
    restart: unless-stopped
    env_file: ../third/docker.env
    environment:
      <<: [*infra-env, *db-env]
      RABBITMQ_URL: amqp://third_svc:${RABBITMQ_THIRD_PASSWORD:?set RABBITMQ_THIRD_PASSWORD}@rabbitmq:5672
      PORT: '4003'
      NODE_ENV: production
    depends_on: *service-deps

  ui:
    networks: [app-network]
    build:
      context: ../ui
      args:
        # Baked at build time and used by the browser, so they must be host-reachable URLs.
        NEXT_PUBLIC_API_URL: https://api-tutor.haiphan.org
        NEXT_PUBLIC_THIRD_SERVICE_URL: ${PUBLIC_THIRD_SERVICE_URL:-http://localhost:4001}
        GIT_COMMIT: ${UI_GIT_COMMIT:-unknown}
    restart: unless-stopped
    ports: ['127.0.0.1:3000:3000']
    env_file: ../ui/docker.env
    depends_on: [gateway]

# ============================================================================
# Named Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  app-network:
    driver: bridge
    name: app-network
    ipam:
      driver: default
      config:
        - subnet: 10.50.0.0/16
          gateway: 10.50.0.1
