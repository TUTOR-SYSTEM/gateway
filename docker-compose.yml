# Full stack: infra (postgres, redis, rabbitmq) + gateway, user, tutor, third services + UI.
#   cd gateway && docker compose up -d --build
#
# Exposure: only the gateway (8888) and the UI (3000) publish ports to the host. Every other
# service (user, tutor-service, third, postgres, redis, rabbitmq) is reachable only on app-network.
# Publishing a service directly would bypass the gateway's JWT/session/throttle layer. For local
# debugging from the host, add the override file: `docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d`.
#
# Required secrets (no defaults, compose refuses to start without them): POSTGRES_PASSWORD,
# RABBITMQ_USER, RABBITMQ_PASSWORD. Put them in docker.env (never commit it); run with
# `bun compose:up` or `docker compose --env-file docker.env up -d`.
#
# RabbitMQ ACL (target state): one broker user per service, each limited to its own queue
# (configure `rabbitmqctl set_permissions` / a definitions file; the admin user is for ops only).
# Until that exists, the broker is still a shared trust boundary: keep 5672 off the public network.
# Each service keeps its own env file; the `environment:` block below overrides the
# host-style values (localhost) with in-network service names.
name: tutor

x-infra-env: &infra-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672
  USER_QUEUE: user_queue
  TUTOR_QUEUE: tutor_queue
  THIRD_QUEUE: third_queue

# One shared Postgres database for user, tutor-service and third. Every service reads the same
# DATABASE_URL built from POSTGRES_* here, and the postgres container creates the same POSTGRES_DB.
x-db-env: &db-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tutor_db}

x-service-deps: &service-deps
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }
  rabbitmq: { condition: service_healthy }

services:

  # ============================================================================
  # Infrastructure: Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tutor_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # CẬP NHẬT COMMAND TẠI ĐÂY
    command:
      - postgres
      # Tắt log kết nối thành công để không bị rác bởi healthcheck local
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      # Luôn log các lỗi (bao gồm login failed) và các cảnh báo
      - -c
      - log_min_messages=warning
      # Log chi tiết lỗi xác thực (rất hữu ích để bắt login failed)
      - -c
      - log_min_error_statement=error
      # Tắt phân giải tên miền ngược để log nhanh hơn
      - -c
      - log_hostname=off
      # Định dạng log có kèm IP (%h) và User (%u)
      - -c
      - log_line_prefix=%m [%p] ip=%h user=%u db=%d app=%a
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tutor_db}' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================================================
  # Infrastructure: Cache
  # ============================================================================
  redis:
    networks: [app-network]
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Infrastructure: Message Queue
  # ============================================================================
  rabbitmq:
    networks: [app-network]
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 90s

  gateway:
    networks: [app-network]
    build: .
    restart: unless-stopped
    env_file: ./docker.env
    environment:
      <<: *infra-env
      PORT: "8888"
      NODE_ENV: production
      # Session check (JWT -> third redis): fail closed unless explicitly opened.
      SESSION_CHECK_FAIL_OPEN: ${SESSION_CHECK_FAIL_OPEN:-false}
      # Refresh cookie: secure is already on in production; set COOKIE_SECURE=true when behind TLS elsewhere.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Number of reverse-proxy hops in front of the gateway (rate limits key on the real client IP).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Comma-separated hosts allowed for https:// notification redirectUrl values.
      NOTIFICATION_REDIRECT_HOSTS: ${NOTIFICATION_REDIRECT_HOSTS:-}
    ports: ['8888:8888']
    depends_on: *service-deps

  user:
    networks: [app-network]
    build: ../user
    restart: unless-stopped
    env_file: ../user/docker.env
    environment:
      <<: [*infra-env, *db-env]
      PORT: "4002"
      NODE_ENV: production
    depends_on: *service-deps

  tutor-service:
    networks: [app-network]
    build: ../tutor
    restart: unless-stopped
    env_file: ../tutor/docker.env
    environment:
      <<: [*infra-env, *db-env]
      PORT: "4003"
      NODE_ENV: production
    depends_on: *service-deps

  third:
    networks: [app-network]
    build: ../third
    restart: unless-stopped
    env_file: ../third/docker.env
    environment:
      <<: [*infra-env, *db-env]
      PORT: "4001"
      NODE_ENV: production
      GATEWAY_BASE_URL: http://gateway:8888
    depends_on: *service-deps

  ui:
    networks: [app-network]
    build:
      context: ../ui
      args:
        # Baked at build time and used by the browser, so they must be host-reachable URLs.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8888}
        NEXT_PUBLIC_THIRD_SERVICE_URL: ${PUBLIC_THIRD_SERVICE_URL:-http://localhost:4001}
    restart: unless-stopped
    ports: ['3000:3000']
    depends_on: [gateway]

# ============================================================================
# Named Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  app-network:
    driver: bridge
    name: app-network
